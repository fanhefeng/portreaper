[package]
name = "portreaper"
version = "0.2.0"
description = "Find and kill orphaned port-listening processes"
authors = ["fhf"]
license = "MIT"
repository = "https://github.com/fanhefeng/portreaper"
edition = "2021"

[lib]
name = "portreaper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
sys-locale = "0.3" # 托盘菜单初始语言（托盘先于 webview 构建，需 Rust 侧探测系统语言）

# Windows 端进程/端口枚举与终止（macOS 不编译这些依赖）
[target.'cfg(windows)'.dependencies]
sysinfo = "0.33"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }
