[package]
name = "portreaper"
version = "0.11.0"
description = "Find and kill orphaned port-listening processes"
authors = ["fhf"]
license = "MIT"
repository = "https://github.com/fanhefeng/portreaper"
edition = "2021"

[lib]
name = "portreaper_lib"
# 桌面端只需 rlib（main.rs 静态链接）。staticlib/cdylib 是 Tauri 移动端脚手架
# 残留 —— 无移动端计划，留着只会拖慢链接、膨胀 target（评审发现）。
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 判定引擎（采集 / 分类 / 终止）。本 crate 只是它的一个前端 —— 判定逻辑一行都
# 不该出现在 src-tauri 里，见 docs/ARCHITECTURE-CORE-SPLIT.md。
portreaper-core = { path = "../crates/portreaper-core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
# 窗口尺寸/位置记忆。纯 Rust 侧注册，**不装对应的 npm 包**、前端一行 JS 都不调 ——
# capabilities 只约束 webview 发起的 IPC，故 src/security-config.test.ts 的精确
# 白名单一个字都不用改。
tauri-plugin-window-state = "2"
sys-locale = "0.3" # 托盘菜单初始语言（托盘先于 webview 构建，需 Rust 侧探测系统语言）
log = "0.4" # 日志门面：全代码 log::info!/warn!/error!，落盘由 tauri-plugin-log 接管
tauri-plugin-log = "2" # 统一日志系统（分环境目录 + 大小轮转，见 paths.rs / lib.rs setup）
# 应用内更新（updater.rs）。与 window-state 同一模式：纯 Rust 侧注册、不装 npm 包，
# 前端只经本 crate 自己的 #[tauri::command] 触达 —— capabilities 白名单零改动。
# 也因此**不进** check-tauri-parity.mjs 的配对表（那张表只管「Rust crate + npm 包」
# 成对存在的插件；本插件没有 npm 侧，加错表反而会响亮失败）。
tauri-plugin-updater = "2"
# 只为 `tokio::time::timeout`（updater.rs 的下载超时）。tauri 的 async runtime 本就是
# tokio，这里不引入新的运行时、只启用 time feature —— `tauri::async_runtime` 没有
# 导出 timeout，而插件的下载路径**自带不了**超时：`check()` 构造 `Update` 时把
# timeout 硬编码成 None（tauri-plugin-updater 2.10.1 的 updater.rs:553，builder 上
# 设的值只作用于检查请求）。没有它，一次连接不断但不再有数据的下载会让
# PendingUpdate 被永久 take 走，用户只能重启应用才能再更新（评审发现）。
tokio = { version = "1", features = ["time"] }
# updater.rs 的 UpdateInfo / InstallProgress 需要 derive(Serialize) —— 这是本 crate
# 第一个真实的 serde 消费者（此前「零 derive、刻意不依赖 serde」的历史见 git blame）。
serde = { version = "1", features = ["derive"] }
# tauri.conf.json 出现 `plugins` 段后，generate_context! 的展开会直接引用
# `::serde_json` 来内嵌插件配置 —— 没有它编译错在宏里（E0433），不是未用依赖。
serde_json = "1"

# 注：sysinfo / windows 已随 scanner + platform 一并移入 portreaper-core ——
# GUI 壳本身不做任何进程枚举或终止，不该直接依赖平台 API。
#
# 同理刻意**没有** once_cell（评审发现的未用依赖，已移除）：进程级单例用标准库
# OnceLock（whitelist.rs / lib.rs），std 有了以后这个 crate 就是纯粹的历史残留。
# `cargo machete` 报出并实测删除后编译通过 —— 想加回来前先确认真有 use。

# 单实例守卫 —— 只在 Windows 需要。macOS 天然免疫：LaunchServices 对同一个 .app
# 的二次启动走 `RunEvent::Reopen`（lib.rs 已处理），不会真的起第二个进程；
# 而 Windows 从 NSIS 快捷方式 / 开始菜单 / 命令行重复启动就是两个进程 ——
# 两个托盘图标、两条 2 秒轮询、两份 sysinfo CPU 采样互相搅乱。
#
# **这个 target 段必须留在文件末尾**：TOML 的表在遇到下一个表头之前一直生效，
# 把它塞进 [dependencies] 中间会把后面所有依赖静默变成 Windows 专属
# （本次改动第一版就是这么炸的：tauri-plugin-log 掉出非 Windows 构建，
# 表现是 `Permission log:default not found`，与依赖本身毫无关系）。
[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = "2"
