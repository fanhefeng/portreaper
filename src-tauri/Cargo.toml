[package]
name = "portreaper"
version = "0.8.0"
description = "Find and kill orphaned port-listening processes"
authors = ["fhf"]
license = "MIT"
repository = "https://github.com/fanhefeng/portreaper"
edition = "2021"

[lib]
name = "portreaper_lib"
# 桌面端只需 rlib（main.rs 静态链接）。staticlib/cdylib 是 Tauri 移动端脚手架
# 残留 —— 无移动端计划，留着只会拖慢链接、膨胀 target（评审发现）。
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 判定引擎（采集 / 分类 / 终止）。本 crate 只是它的一个前端 —— 判定逻辑一行都
# 不该出现在 src-tauri 里，见 docs/ARCHITECTURE-CORE-SPLIT.md。
portreaper-core = { path = "../crates/portreaper-core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
sys-locale = "0.3" # 托盘菜单初始语言（托盘先于 webview 构建，需 Rust 侧探测系统语言）
log = "0.4" # 日志门面：全代码 log::info!/warn!/error!，落盘由 tauri-plugin-log 接管
tauri-plugin-log = "2" # 统一日志系统（分环境目录 + 大小轮转，见 paths.rs / lib.rs setup）

# 注：sysinfo / windows 已随 scanner + platform 一并移入 portreaper-core ——
# GUI 壳本身不做任何进程枚举或终止，不该直接依赖平台 API。
