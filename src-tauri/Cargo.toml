[package]
name = "portreaper"
version = "0.1.0"
description = "Find and kill orphaned port-listening processes"
authors = ["fhf"]
license = "MIT"
repository = "https://github.com/fanhefeng/portreaper"
edition = "2021"

[lib]
name = "portreaper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
