<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#1b2735"/><stop offset="1" stop-color="#0b1118"/>
    </linearGradient>
    <linearGradient id="bl" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#67e8f9"/><stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="nd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fcd34d"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- 圆角体占画布 ~80%（macOS 安全边距），四周透明 -->
  <g transform="translate(51.2 51.2) scale(0.8)">
    <rect width="512" height="512" rx="114" fill="url(#bg)"/>
    <!-- 端口靶心：被收割目标 -->
    <circle cx="232" cy="336" r="58" fill="none" stroke="#0e7490" stroke-width="22"/>
    <circle cx="232" cy="336" r="15" fill="url(#nd)"/>
    <!-- 镰刀柄 -->
    <path d="M 322 205 L 384 418" fill="none" stroke="#0e7490" stroke-width="34" stroke-linecap="round"/>
    <!-- 镰刀弯刃 -->
    <path d="M 322 196 C 250 120, 156 128, 108 236 C 176 206, 256 214, 320 232 Z" fill="url(#bl)"/>
  </g>
</svg>
