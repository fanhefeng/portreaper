# Cargo workspace 根。
#
# 成员是**平级**的兄弟 crate：判定引擎（crates/portreaper-core）与消费它的两个前端
# （crates/portreaper-cli = 命令行 / Raycast 的后端，src-tauri = 桌面 GUI 壳）。
# 把 workspace 根放在仓库根，而不是让 src-tauri 反过来包含 ../crates/*，是因为只有
# 平级布局能自然表达「引擎不属于任何一个前端」—— CLI 落地后这一点已经兑现。
#
# 代价（迁移时已一并处理，改动这里前请确认三处仍同步）：
#   - target/ 从 src-tauri/target/ 移到仓库根 → .gitignore、CI 的 rust-cache
#     workspaces 键、release.yml 的产物路径；
#   - Cargo.lock 从 src-tauri/ 移到仓库根 → scripts/bump-version.mjs 的 CARGO_LOCK。
[workspace]
resolver = "2"
members = ["crates/portreaper-core", "crates/portreaper-cli", "src-tauri"]

# 版本号刻意**不**用 workspace 继承：scripts/bump-version.mjs 靠正则在
# src-tauri/Cargo.toml 的 [package] 段里定点改 `version = "..."`，继承写法
# （version.workspace = true）会让它找不到目标而响亮失败。各成员各自声明版本。
[workspace.package]
edition = "2021"
license = "MIT"
authors = ["fhf"]
repository = "https://github.com/fanhefeng/portreaper"

# 发布构建的优化取舍。**必须写在 workspace 根**：cargo 只认根 manifest 的 profile，
# 写进 src-tauri/Cargo.toml 会被静默忽略（连一句警告都没有）。
#
# 两处对官方「体积最小化」建议的**刻意偏离**，理由留在这里，别顺手改回去：
#
#   - `panic = "unwind"` 是默认值，这里显式写下来是为了挡住「为体积改成 abort」
#     那一手：abort 会一次性废掉 lib.rs 的 panic hook、commands.rs 的
#     `PoisonError::into_inner` 毒化恢复、以及 spawn_blocking 的 JoinError 兜底 ——
#     一次扫描 panic 会从「本轮失败、下轮重试」退化成「常驻托盘进程凭空消失」。
#   - `opt-level` 保持 3（不用官方推荐的 "s"/"z"）：本应用每 2 秒有一条真实热
#     路径（解析 lsof + 两次 ps 的全量文本输出），拿运行时换安装包体积不划算。
#
#   - `strip = "debuginfo"` 而不是 "symbols"：DWARF 是体积大头，剥掉它；但保留
#     符号名，panic hook 抓到的 backtrace 才有函数名可读，否则那个 hook 只剩
#     一串地址。
[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"
panic = "unwind"
