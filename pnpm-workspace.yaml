# packages 字段必须存在：pnpm 9 对缺失该字段的 workspace 文件直接报
# `ERROR packages field missing or empty` —— 单包仓库显式声明根目录即可。
# （Vite+ 迁移后 CI 与 devEngines 均已钉 pnpm 11，此字段保留兼容且无害。）
packages:
  - "."

# esbuild 的 postinstall 只做二进制自检（实际二进制经平台 optionalDependencies 分发），
# 不需要运行其构建脚本 —— 显式记录决策，否则 pnpm 10+ 在 install/exec 前置检查时报错。
allowBuilds:
  esbuild: false
# Vite+ 与 core 保持一致；已移除旧 0.2.x 的发布等待例外。
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vite-plus: 1.5.0
overrides:
  esbuild@<0.28.1: 0.28.1
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
minimumReleaseAgeExclude:
  - "@oxfmt/binding-android-arm-eabi@0.76.0"
  - "@oxfmt/binding-android-arm64@0.76.0"
  - "@oxfmt/binding-darwin-arm64@0.76.0"
  - "@oxfmt/binding-darwin-x64@0.76.0"
  - "@oxfmt/binding-freebsd-x64@0.76.0"
