  - "@oxfmt/binding-linux-arm-musleabihf@0.76.0"
  - "@oxfmt/binding-linux-arm64-gnu@0.76.0"
  - "@oxfmt/binding-linux-arm64-musl@0.76.0"
  - "@oxfmt/binding-linux-ppc64-gnu@0.76.0"
  - "@oxfmt/binding-linux-riscv64-gnu@0.76.0"
  - "@oxfmt/binding-linux-riscv64-musl@0.76.0"
  - "@oxfmt/binding-linux-s390x-gnu@0.76.0"
  - "@oxfmt/binding-linux-x64-gnu@0.76.0"
  - "@oxfmt/binding-linux-x64-musl@0.76.0"
  - "@oxfmt/binding-openharmony-arm64@0.76.0"
  - "@oxfmt/binding-win32-arm64-msvc@0.76.0"
  - "@oxfmt/binding-win32-ia32-msvc@0.76.0"
  - "@oxfmt/binding-win32-x64-msvc@0.76.0"
  - "@oxlint/binding-android-arm-eabi@1.91.0"
  - "@oxlint/binding-android-arm64@1.91.0"
  - "@oxlint/binding-darwin-arm64@1.91.0"
  - "@oxlint/binding-darwin-x64@1.91.0"
