# 依赖更新提醒。github-actions 生态尤其关键：workflow 里的第三方
# action 全部钉了 commit SHA（供应链加固），没有 Dependabot 就没人提醒升级。
#
# npm 生态一条都不留。两次尝试、两种失败，写在这里是为了别再加第三次：
#
# 1. 仓库根（Vite+ 迁移后移除）：vite/vitest 等经 pnpm-workspace.yaml 的 catalog:
#    协议由 vite-plus 捆绑托管，updater 解析不了该布局 —— 实测所有 npm 更新任务
#    （含 @types/node 这类普通依赖）都在 update_files 阶段挂掉。
#
# 2. /integrations/raycast（v0.8.1 后短暂启用，随即撤除）：该目录**确实**是普通
#    npm 布局 —— 自带 package-lock.json，且不在 pnpm-workspace.yaml 的 packages
#    里（那里只有 "."）。但这不够。Dependabot 的 pnpm 探测只看**父目录**有没有
#    pnpm-lock.yaml + pnpm-workspace.yaml，命中就判定为 workspace 子目录并拒绝：
#      misconfigured_tooling {"tool-name": "pnpm", message: "Updating workspaces
#      from inside a workspace subdirectory is not supported. Both pnpm-lock.yaml
#      and pnpm-workspace.yaml exist in a parent directory. Dependabot should only
#      update from the root workspace."}
#    它甚至会拿仓库根的 vite-plus 去 `npm install` 这个目录（实测日志如此）。
#    结论：只要仓库根是 pnpm workspace，任何子目录的 npm 配置都会这样挂 ——
#    与该子目录自身的布局是否规范无关。
#
# 所以 JS 依赖升级一律人工：仓库根走 `vp outdated` / `vp update`，vite-plus 本体走
# `vp migrate`（并同步 pnpm-workspace 的钉版条目）；扩展走
# `npm outdated --prefix integrations/raycast`（提交 Store 前必跑，已写进
# docs/RAYCAST-MAINTAINING.md 的「依赖升级」小节）。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # workspace 根是仓库根（Cargo.lock 也在那里）。指到 /src-tauri 会让 updater
  # 看不见 crates/portreaper-core 的依赖，也读不到共享 lockfile。
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    ignore:
      # sysinfo / windows 是 FFI/采集层的高风险依赖：refresh_kind 语义、
      # GetExtendedTcpTable / SHGetKnownFolderPath 签名都按当前版本逐字段
      # 核对过（CLAUDE.md 有事故记录），而 Windows 无真机 QA —— CI 编译过
      # ≠ 行为对。只收 patch 级更新；major/minor 升级须人工专项评估。
      - dependency-name: sysinfo
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: windows
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
