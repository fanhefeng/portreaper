# 依赖更新提醒。github-actions 生态尤其关键：workflow 里的第三方
# action 全部钉了 commit SHA（供应链加固），没有 Dependabot 就没人提醒升级。
#
# npm 生态已移除（Vite+ 迁移后）：vite/vitest 等经 pnpm-workspace.yaml 的
# catalog: 协议由 vite-plus 捆绑托管，Dependabot 的 npm updater 解析不了该
# 布局 —— 实测迁移后所有 npm 更新任务（含 @types/node 这类普通依赖）都在
# update_files 阶段挂掉。JS 依赖升级走 `vp outdated` / `vp update`，
# vite-plus 本体升级走 `vp migrate`（并同步 pnpm-workspace 的钉版条目）。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # integrations/raycast 是普通 npm 布局（package-lock.json，无 catalog:），
  # updater 解析得了 —— 上面「npm 生态已移除」的理由只适用于仓库根的
  # vite-plus catalog 布局，不适用于这里。@raycast/api 的漂移否则无人提醒。
  - package-ecosystem: npm
    directory: /integrations/raycast
    schedule:
      interval: monthly

  # workspace 根是仓库根（Cargo.lock 也在那里）。指到 /src-tauri 会让 updater
  # 看不见 crates/portreaper-core 的依赖，也读不到共享 lockfile。
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    ignore:
      # sysinfo / windows 是 FFI/采集层的高风险依赖：refresh_kind 语义、
      # GetExtendedTcpTable / SHGetKnownFolderPath 签名都按当前版本逐字段
      # 核对过（CLAUDE.md 有事故记录），而 Windows 无真机 QA —— CI 编译过
      # ≠ 行为对。只收 patch 级更新；major/minor 升级须人工专项评估。
      - dependency-name: sysinfo
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: windows
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
