# 三个生态的依赖更新提醒。github-actions 生态尤其关键：workflow 里的第三方
# action 全部钉了 commit SHA（供应链加固），没有 Dependabot 就没人提醒升级。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      # React 要求 react 与 react-dom 严格同版本 —— 拆开升必挂
      # （Dependabot 曾单独把 react 升到 19.2.7 而 react-dom 停在 19.2.6）
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: monthly
    ignore:
      # sysinfo / windows 是 FFI/采集层的高风险依赖：refresh_kind 语义、
      # GetExtendedTcpTable / SHGetKnownFolderPath 签名都按当前版本逐字段
      # 核对过（CLAUDE.md 有事故记录），而 Windows 无真机 QA —— CI 编译过
      # ≠ 行为对。只收 patch 级更新；major/minor 升级须人工专项评估。
      - dependency-name: sysinfo
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: windows
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
