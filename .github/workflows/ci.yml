name: CI

# NOTE: paths-ignore means doc/website-only changes skip this job entirely.
# Do NOT mark "CI / Check" as a *required* status check in branch protection —
# a docs-only PR would wait forever for a status that never reports.
# Keep CI advisory, or replace paths-ignore with an in-job path filter first.
# website/** changes are NOT unchecked: pages.yml runs the website guards
# (syntax + asset-name parity) before every deploy.
# README.md is deliberately NOT ignored (no "**/*.md" pattern): it is one of
# the three sources check-release-assets.mjs guards — a README-only edit that
# breaks a stable asset name must fail here, not on release day (review-caught:
# the old "**/*.md" ignore let exactly that land on main unchecked).
#
# All third-party actions are pinned to full commit SHAs (supply chain): the
# release pipeline ships unsigned binaries via stable `latest` URLs, so a
# hijacked action tag could inject code straight into user downloads.
# Dependabot (.github/dependabot.yml) keeps the pins fresh.
on:
  push:
    branches: [main]
    paths-ignore:
      - "website/**"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "website/**"
      - "docs/**"
  # 手动触发口。GitHub 平台故障可能留下既无法取消也无法重跑的僵尸运行
  # （2026-08-06 事故实录：rerun 后 status=queued 但 jobs 为空，cancel 报
  # 「已完成」、rerun 报「正在跑」、force-cancel 409「尚未入队」）——
  # 此时需要一个不造提交就能拉起全新运行的入口。
  workflow_dispatch:

permissions:
  contents: read

# 同一分支的新提交取消仍在跑的旧运行：一次 push 触发的矩阵是 macOS + Windows
# 各一台，连推三次就有六台机器在为两份已经过时的代码排队。分组带 ref，故不同
# PR 之间照常并行。main 上不取消 —— 那里的每个 commit 都要留下自己的结论。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      # pnpm/action-setup must run BEFORE setup-node so that `cache: pnpm` can
      # locate the pnpm binary. Since the Vite+ migration the workspace file uses
      # pnpm 11 features (catalog: overrides, allowBuilds) and package.json pins
      # pnpm 11.16 via devEngines — keep this major in sync with devEngines.
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .node-version
          cache: pnpm

      # Pinned toolchain (not @stable) so rustfmt's line-wrapping heuristics
      # can't drift under us and break `cargo fmt --check`. Keep the toolchain
      # version byte-identical to `rust-toolchain.toml` at the repo root and to
      # release.yml — bump all three together. (The action itself is pinned by
      # SHA; the toolchain version moved from the ref to the `toolchain` input.)
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
          # x86_64 target on the macOS (arm64) leg: the release matrix builds
          # x86_64-apple-darwin — without a CI compile check, target-specific
          # breakage only surfaces on release day (re-run can't fix a compile error).
          targets: ${{ runner.os == 'macOS' && 'x86_64-apple-darwin' || '' }}

      # workspace 根在仓库根（成员：crates/portreaper-core + src-tauri），
      # 故 target/ 也在根 —— 拆出 core 之前这里是 "src-tauri -> target"。
      - name: Cache Rust
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ". -> target"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Frontend checks: fmt/lint, type-check, tests, then build (no full
      # `tauri build` in CI — we don't bundle/sign here, so Windows needs no
      # extra Tauri system deps). All frontend tooling goes through Vite+ (vp);
      # tsc stays explicit because `vp check` does not yet cover type-checking.
      # `typecheck` 覆盖两个 project：应用侧 tsconfig.json（webview 代码，无 Node
      # 全局）+ tsconfig.test.json（测试，含 @types/node）—— 裸 tsc 只查前者。
      - name: Format + lint (vp check)
        run: pnpm exec vp check

      - name: Type-check (tsc)
        run: pnpm run typecheck

      - name: Frontend tests (vp test)
        run: pnpm exec vp test run

      - name: Build frontend (vp build)
        run: pnpm exec vp build

      # Rust checks: formatting, lints (warnings = errors), tests, and a debug
      # build to catch compile errors on both macOS and Windows.
      # --all/--workspace covers BOTH members: crates/portreaper-core (the
      # classification engine) and src-tauri (the GUI shell). The old
      # `--manifest-path src-tauri/Cargo.toml` form would silently skip the
      # engine — i.e. skip every line of logic these gates exist to protect.
      - name: Rust formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Rust build
        run: cargo build --workspace

      # Intel macOS compile check (release matrix parity — see toolchain note)
      - name: Rust check (x86_64-apple-darwin)
        if: runner.os == 'macOS'
        run: cargo check --workspace --target x86_64-apple-darwin

      # Guard scripts (platform-neutral) — run once only, on the macOS leg.
      # Self-tests first: a guard that silently passes is worse than no guard.
      - name: Guard script self-tests
        if: runner.os == 'macOS'
        run: node --test scripts/*.test.mjs

      - name: Reason parity check
        if: runner.os == 'macOS'
        run: node scripts/check-reason-parity.mjs

      - name: Release asset name parity check
        if: runner.os == 'macOS'
        run: node scripts/check-release-assets.mjs

      # bundle identifier must agree between portreaper-core's paths.rs and
      # tauri.conf.json — a split makes the GUI and the CLI/Raycast write
      # separate whitelist.json files, silently.
      - name: Paths parity check
        if: runner.os == 'macOS'
        run: node scripts/check-paths-parity.mjs

      # Rust 工具链版本三处写死（rust-toolchain.toml / ci.yml / release.yml），
      # 漂移的症状是「本地 fmt 过、CI 的 rustfmt 换行启发不同而翻红」。
      - name: Toolchain parity check
        if: runner.os == 'macOS'
        run: node scripts/check-toolchain-parity.mjs

      # ProcessEntry/ParentRef 有三份镜像（Rust model.rs / src/model.ts /
      # raycast cli.ts）——serde 契约加字段漏改任何一份都在此翻红。
      - name: Model parity check
        if: runner.os == 'macOS'
        run: node scripts/check-model-parity.mjs

      # integrations/raycast 是独立 npm 项目（不在 pnpm workspace 内），此前
      # 完全游离于 CI —— 而它承载扩展里最敏感的逻辑（下载/校验/执行二进制）。
      # 只做 typecheck，不 ray build（无 Raycast 运行时）。
      - name: Raycast extension typecheck
        if: runner.os == 'macOS'
        run: |
          npm ci --prefix integrations/raycast
          npm run typecheck --prefix integrations/raycast

      # 五处版本清单（package.json / tauri.conf.json / 两个 Cargo.toml / Cargo.lock）
      # 必须自洽：以 package.json 为基准。此前该检查只在 release.yml 的
      # verify-version 里跑，手改单个清单造成的漂移要等打 tag 那天才翻红。
      - name: Version consistency check
        if: runner.os == 'macOS'
        run: node scripts/bump-version.mjs --check "$(node -p "require('./package.json').version")"
