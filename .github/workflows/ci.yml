name: CI

# NOTE: paths-ignore means doc/website-only changes skip this job entirely.
# Do NOT mark "CI / Check" as a *required* status check in branch protection —
# a docs-only PR would wait forever for a status that never reports.
# Keep CI advisory, or replace paths-ignore with an in-job path filter first.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'website/**'
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'website/**'
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # pnpm/action-setup must run BEFORE setup-node so that `cache: pnpm` can
      # locate the pnpm binary. This repo has no `packageManager` field in
      # package.json, and pnpm-lock.yaml is lockfileVersion 9, so we pin pnpm 9.
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      # Pinned (not @stable) so rustfmt's line-wrapping heuristics can't drift
      # under us and break `cargo fmt --check`. Keep this version byte-identical
      # to `rust-toolchain.toml` at the repo root — bump both together.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Frontend checks: type-check then build (no full `tauri build` in CI — we
      # don't bundle/sign here, so Windows needs no extra Tauri system deps).
      - name: Type-check (tsc)
        run: pnpm exec tsc --noEmit

      - name: Frontend tests (vitest)
        run: pnpm exec vitest run

      - name: Build frontend (vite)
        run: pnpm exec vite build

      # Rust checks: formatting, lints (warnings = errors), tests, and a debug
      # build to catch compile errors on both macOS and Windows.
      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Rust build
        run: cargo build --manifest-path src-tauri/Cargo.toml

      # Guard scripts (platform-neutral) — run once only, on the macOS leg.
      # Self-tests first: a guard that silently passes is worse than no guard.
      - name: Guard script self-tests
        if: runner.os == 'macOS'
        run: node --test scripts/*.test.mjs

      - name: Reason parity check
        if: runner.os == 'macOS'
        run: node scripts/check-reason-parity.mjs
