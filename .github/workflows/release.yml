name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Avoid two overlapping release runs for the same tag clobbering each other.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # --------------------------------------------------------------------------
  # 1. Verify that the three (+lockfile) version files agree with the tag.
  #    `v0.2.0` -> bump-version.mjs --check 0.2.0  (fails on any mismatch).
  # --------------------------------------------------------------------------
  verify-version:
    name: Verify version matches tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      # Same pinned Node as ci.yml/build (runner default drifts independently)
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .node-version

      - name: Check version files match tag
        run: node scripts/bump-version.mjs --check "${GITHUB_REF_NAME#v}"

      # Stable asset names are hardcoded in three places (publish job below,
      # website download links, README) — fail the release before building if
      # they ever drift apart.
      - name: Release asset name parity check
        run: node scripts/check-release-assets.mjs

  # --------------------------------------------------------------------------
  # 2. Create the draft release ONCE, before the build matrix.
  #    Without this, the three parallel tauri-action legs race to create the
  #    same release (get-or-create with no locking) and can 422 or produce
  #    duplicate drafts with assets scattered across them — leaving the
  #    release permanently stuck as a draft. The legs upload via releaseId.
  # --------------------------------------------------------------------------
  create-release:
    name: Create draft release
    needs: verify-version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Create (or reuse) draft release
        id: create
        run: |
          set -euo pipefail

          cat > body.md <<'BODY'
          ## Downloads

          - macOS (Apple Silicon): `Portreaper-macos-arm64.dmg`
          - macOS (Intel): `Portreaper-macos-x64.dmg`
          - Windows (x64): `Portreaper-windows-x64-setup.exe`

          ---

          ### macOS — app is unsigned / 应用未签名

          The macOS build is **not code-signed or notarized**, so Gatekeeper
          will warn on first launch. To open it:

          - Right-click (or Control-click) the app → **Open** → **Open**, or
          - **System Settings → Privacy & Security → Open Anyway**, or
          - Remove the quarantine flag in Terminal:
            `xattr -dr com.apple.quarantine /Applications/Portreaper.app`

          macOS 版本**未签名、未公证**，首次打开会被 Gatekeeper 拦截。可以：

          - 右键（或按住 Control 点击）应用 → **打开** → **打开**，或
          - 打开 **系统设置 → 隐私与安全性 → 仍要打开**，或
          - 在终端中移除隔离属性：
            `xattr -dr com.apple.quarantine /Applications/Portreaper.app`

          <!-- WINDOWS-EXPERIMENTAL: de-experimental checklist anchor — when
               Windows passes manual QA (docs/TESTING-WINDOWS.md), delete from
               this comment through the end of the section below. -->
          ### Windows — experimental build / 实验性版本

          The Windows build is **experimental (CI-tested only, no manual QA
          yet)**. Please report any issues.

          Windows 版本为**实验性（仅经 CI 测试，尚未人工 QA）**，欢迎反馈问题。
          BODY

          # Idempotent for workflow re-runs: reuse an existing draft if present.
          # 只复用**草稿**：已发布的 tag 若被当成草稿复用，后续 job 会把资产覆盖
          # 到线上版本里 —— 用户已经下载过的产物被就地替换，且无从察觉。
          existing_json="$(gh release view "$TAG" --json databaseId,isDraft 2>/dev/null || true)"
          if [ -n "$existing_json" ]; then
            existing="$(jq -r .databaseId <<<"$existing_json")"
            if [ "$(jq -r .isDraft <<<"$existing_json")" != "true" ]; then
              echo "::error::Release $TAG is already published; refusing to touch its assets."
              exit 1
            fi
            echo "Reusing existing draft release id $existing for $TAG"
            echo "id=$existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 预发布标签（v1.2.3-rc1 等带 - 后缀）必须打 --prerelease：
          # 网站/README 硬编码 releases/latest/download/<stable-name>，
          # 不标记的 rc 一经发布就会成为 "latest"，所有访客静默下到预发布版。
          # GitHub 只有标了 prerelease 的 release 才不参与 "latest" 解析。
          prerelease_flag=""
          case "$TAG" in *-*) prerelease_flag="--prerelease" ;; esac

          gh release create "$TAG" --draft $prerelease_flag --title "Portreaper $TAG" --notes-file body.md
          id="$(gh release view "$TAG" --json databaseId --jq .databaseId)"
          echo "Created draft release id $id for $TAG"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  # --------------------------------------------------------------------------
  # 3. Build per-target bundles and upload them to the pre-created DRAFT
  #    release (by id — no per-leg create race). The release stays a draft
  #    until the publish job verifies/renames the assets, so users never see
  #    a half-uploaded release.
  # --------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.target || matrix.os }})
    needs: [verify-version, create-release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # cli_asset: the STABLE name portreaper-cli ships under. The Raycast
        # extension downloads it by this exact name, so treat it as a public
        # contract — check-release-assets.mjs guards it against drift.
        # macOS 的 bundles 必须是 `app,dmg` 而不是裸 `dmg`：updater 资产
        # （.app.tar.gz + .sig）只随 **app** target 产出 —— 只打 dmg 时 bundler
        # 警告 "no updater-enabled targets were built" 并把中间产物 .app 清掉，
        # 应用内更新的资产就一个都没有（本机 tauri build --bundles dmg 实测）。
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
            cli_asset: portreaper-cli-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
            cli_asset: portreaper-cli-macos-x64
          - os: windows-latest
            target: ""
            bundles: nsis
            cli_asset: portreaper-cli-windows-x64.exe
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .node-version
          cache: pnpm

      # On Windows the matrix target is empty (host = x86_64-pc-windows-msvc),
      # so we pass an empty `targets:` and let rustup use the default host.
      # Toolchain pinned to match `rust-toolchain.toml` / ci.yml — release
      # builds use the same compiler the gate ran against. Bump all three
      # together. (Action pinned by SHA; version moved to the `toolchain` input.)
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.target }}

      # workspace 根在仓库根（成员：crates/portreaper-core + src-tauri），
      # target/ 随之上移 —— 拆出 core 之前这里是 "src-tauri -> target"。
      - name: Cache Rust
        uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          workspaces: ". -> target"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and upload bundle
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ----------------------------------------------------------------
          # Signing/notarization (currently DISABLED — builds ship unsigned).
          #
          # ⚠️ Do NOT re-add these env lines while the secrets are unset:
          # an unset secret renders as an EMPTY string, and tauri-bundler
          # treats a *present* APPLE_CERTIFICATE (even empty) as "please
          # sign" → `security import` fails and the whole build leg dies.
          # (Verified on the first v0.2.0 run.)
          #
          # To enable signing later: add the repo secrets below, then
          # UNCOMMENT this block. See docs/RELEASING.md.
          #   APPLE_CERTIFICATE           base64 of the .p12 Developer ID cert
          #   APPLE_CERTIFICATE_PASSWORD  password for that .p12
          #   APPLE_SIGNING_IDENTITY      e.g. "Developer ID Application: Name (TEAMID)"
          #   APPLE_ID                    Apple ID email used for notarization
          #   APPLE_PASSWORD              app-specific password for notarization
          #   APPLE_TEAM_ID               10-char Apple Developer Team ID
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Tauri updater signing（应用内更新，v0.11.0 起）：createUpdaterArtifacts
          # 开着时缺私钥会让所有构建腿直接失败 —— 该 secret 必须存在。
          # 私钥无口令，PASSWORD 给显式空串（写字面量而不是引用不存在的 secret，
          # 语义一目了然；缺省不设会让签名步骤落回交互式询问并挂死 CI）。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # FUTURE (Windows code signing): tauri-action does not sign Windows
          # bundles itself. To sign the NSIS installer, configure a signing
          # command via tauri.conf.json `bundle.windows.signCommand` (Tauri 2)
          # and provide the cert through a secret consumed by that command.
        with:
          # Upload into the pre-created draft — never create from a matrix leg.
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # latest.json 由 publish job 用 scripts/generate-latest-json.mjs 统一生成：
          # tauri-action 的三条并行腿各自「下载已有 latest.json → 合并 → 重传」是
          # 无锁的读改写，可能互相覆盖平台条目（已知竞态）。.sig 资产仍由本 action
          # 上传（uploadUpdaterSignatures 默认 true）。
          uploadUpdaterJson: false
          # `args` is empty for Windows (no --target), so omit --target there.
          args: ${{ matrix.target && format('--target {0} --bundles {1}', matrix.target, matrix.bundles) || format('--bundles {0}', matrix.bundles) }}

      # NOTE (removed in v0.10.3): the dmg used to be post-processed here to inject
      # a `Remove-Quarantine.command` helper. Dropped because it could no longer
      # work for the users it existed for. The helper carries the same quarantine
      # flag as the app, so double-clicking it is SIGKILLed by Gatekeeper; Apple
      # removed the right-click → Open bypass in macOS 15, leaving "approve it in
      # System Settings → Privacy & Security" as the only way to run it — which is
      # the exact same procedure as approving the app itself. It saved nobody a
      # step and cost a confusing detour (observed on macOS 26.5: helper killed,
      # user assumed it had run, app then reported "damaged"). Until the app is
      # Developer ID signed + notarized, `xattr -dr com.apple.quarantine` is the
      # documented route — see README / the website install section.

      # portreaper-cli — the engine's process boundary, consumed by the Raycast
      # extension (and any script). It ships as its OWN release asset rather than
      # being bundled inside the .app: Tauri's externalBin/resources require the
      # file to exist at *dev* time too, which would put a "build the CLI first"
      # tripwire in front of every `pnpm tauri dev`.
      #
      # The Raycast Store rules explicitly allow "download from trusted sources
      # with hash verification" but disallow making the user install things
      # themselves — hence stable names here plus a SHA256SUMS file produced by
      # the publish job.
      #
      # Cheap: portreaper-core is already compiled by the tauri build above, so
      # this only links the CLI binary itself.
      - name: Build portreaper-cli
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release -p portreaper-cli --target "${{ matrix.target }}"
            built="target/${{ matrix.target }}/release/portreaper-cli"
          else
            cargo build --release -p portreaper-cli
            built="target/release/portreaper-cli.exe"
          fi
          if [ ! -f "$built" ]; then
            echo "::error::portreaper-cli was not produced at $built"
            exit 1
          fi
          cp "$built" "${{ matrix.cli_asset }}"
          echo "Built ${{ matrix.cli_asset }} ($(wc -c < "${{ matrix.cli_asset }}") bytes)"

      - name: Upload portreaper-cli to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: gh release upload "$TAG" "${{ matrix.cli_asset }}" --clobber

  # --------------------------------------------------------------------------
  # 4. Verify the expected assets exist on the draft release (3 installers +
  #    3 CLI binaries + 5 updater artifacts), re-upload the installers under
  #    STABLE names, generate the CLI SHA256SUMS and the updater's latest.json,
  #    then (and only then) flip the release out of draft. If any expected
  #    asset is missing the job fails and the release stays a draft so nothing
  #    broken is ever published.
  # --------------------------------------------------------------------------
  publish:
    name: Verify, rename assets, and publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      # latest.json 生成脚本在仓库里（此前本 job 纯靠 gh，不需要代码）
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .node-version

      - name: Verify expected assets exist
        run: |
          set -euo pipefail
          echo "Inspecting release assets for $TAG ..."
          names="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          echo "Found assets:"
          echo "$names"

          # Tauri 2 bundler naming (confirmed from tauri-bundler source):
          #   aarch64-apple-darwin -> Portreaper_<ver>_aarch64.dmg
          #   x86_64-apple-darwin  -> Portreaper_<ver>_x64.dmg
          #   x86_64 NSIS          -> Portreaper_<ver>_x64-setup.exe
          # Match with tolerant globs so an exact version / future locale
          # suffix does not break the check.
          missing=0
          check() {
            local label="$1" pattern="$2"
            local match
            match="$(echo "$names" | grep -iE "$pattern" | head -n1 || true)"
            if [ -z "$match" ]; then
              echo "::error::Missing expected asset: $label (pattern: $pattern)"
              missing=1
            else
              echo "OK  $label -> $match"
            fi
          }
          check "macOS arm64 dmg"  '^Portreaper_.*_aarch64\.dmg$'
          check "macOS x64 dmg"    '^Portreaper_.*_x64\.dmg$'
          check "Windows x64 nsis" '^Portreaper_.*_x64-setup\.exe$'
          # 应用内更新的资产（createUpdaterArtifacts + tauri-action 上传）：
          # macOS 是 .app.tar.gz + .sig，Windows 复用 NSIS 安装器、只多一个 .sig。
          # 缺任何一个都意味着已装用户的更新链路残废 —— 与安装包同级的硬校验。
          check "macOS arm64 updater"      '^Portreaper_.*_aarch64\.app\.tar\.gz$'
          check "macOS arm64 updater sig"  '^Portreaper_.*_aarch64\.app\.tar\.gz\.sig$'
          check "macOS x64 updater"        '^Portreaper_.*_x64\.app\.tar\.gz$'
          check "macOS x64 updater sig"    '^Portreaper_.*_x64\.app\.tar\.gz\.sig$'
          check "Windows nsis updater sig" '^Portreaper_.*_x64-setup\.exe\.sig$'
          # portreaper-cli 已由 build job 以稳定名上传（无需改名）。仍要逐个核对：
          # Raycast 扩展按这些名字下载，缺一个就是「扩展装了但用不了」。
          check "cli macOS arm64"  '^portreaper-cli-macos-arm64$'
          check "cli macOS x64"    '^portreaper-cli-macos-x64$'
          check "cli Windows x64"  '^portreaper-cli-windows-x64\.exe$'

          if [ "$missing" -ne 0 ]; then
            echo "::error::One or more bundles are missing; leaving release as draft."
            exit 1
          fi

      - name: Re-upload assets under stable names
        run: |
          set -euo pipefail
          names="$(gh release view "$TAG" --json assets --jq '.assets[].name')"

          pick() { echo "$names" | grep -iE "$1" | head -n1; }
          arm_dmg="$(pick '^Portreaper_.*_aarch64\.dmg$')"
          x64_dmg="$(pick '^Portreaper_.*_x64\.dmg$')"
          win_exe="$(pick '^Portreaper_.*_x64-setup\.exe$')"

          mkdir -p dist
          echo "Downloading: $arm_dmg $x64_dmg $win_exe"
          gh release download "$TAG" --dir dist \
            --pattern "$arm_dmg" \
            --pattern "$x64_dmg" \
            --pattern "$win_exe"

          cp "dist/$arm_dmg" "dist/Portreaper-macos-arm64.dmg"
          cp "dist/$x64_dmg" "dist/Portreaper-macos-x64.dmg"
          cp "dist/$win_exe" "dist/Portreaper-windows-x64-setup.exe"

          gh release upload "$TAG" --clobber \
            "dist/Portreaper-macos-arm64.dmg" \
            "dist/Portreaper-macos-x64.dmg" \
            "dist/Portreaper-windows-x64-setup.exe"

      # 校验和：Raycast Store 要求「从可信源下载并校验完整性」。扩展先取这个
      # 文件，再据它核对下载到的 CLI 二进制 —— 一份汇总文件而非每个资产一个
      # .sha256，扩展少一次往返。放在 publish job 是因为要汇总三条 build 腿的产物。
      - name: Publish SHA256SUMS for portreaper-cli
        run: |
          set -euo pipefail
          mkdir -p cli
          gh release download "$TAG" --dir cli \
            --pattern "portreaper-cli-macos-arm64" \
            --pattern "portreaper-cli-macos-x64" \
            --pattern "portreaper-cli-windows-x64.exe"
          (cd cli && sha256sum \
            portreaper-cli-macos-arm64 \
            portreaper-cli-macos-x64 \
            portreaper-cli-windows-x64.exe > portreaper-cli-SHA256SUMS)
          echo "Checksums:"
          cat cli/portreaper-cli-SHA256SUMS
          gh release upload "$TAG" "cli/portreaper-cli-SHA256SUMS" --clobber

      # 应用内更新的静态源：从三份 .sig 汇总生成（缺平台会响亮失败，见脚本头注）。
      # 必须在 un-draft 之前上传 —— 应用打的端点是 releases/latest/download/latest.json，
      # 发布瞬间它就该在了。URL 指向本 tag 的**版本化**资产名（签名与二进制成对），
      # 不用稳定名 —— 稳定名每次发版被覆盖，旧 latest.json 缓存 + 新二进制 = 验签必败。
      - name: Generate and upload latest.json (in-app updater feed)
        run: |
          set -euo pipefail
          mkdir -p sigs
          gh release download "$TAG" --dir sigs --pattern "*.sig"
          node scripts/generate-latest-json.mjs "$TAG" sigs \
            "Portreaper $TAG — release notes: https://github.com/$GH_REPO/releases/tag/$TAG" \
            > latest.json
          echo "Generated latest.json:"
          cat latest.json
          gh release upload "$TAG" latest.json --clobber

      - name: Publish release (un-draft)
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false
          echo "Published release $TAG."
