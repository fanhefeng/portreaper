name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  # 平台故障后 dispatch 通道可能积压数小时（2026-08-06 事故：两次 dispatch 均
  # 停在 queued 且 jobs 为空，而 push 事件 18 秒即开跑）——届时改用 push 触发：
  # 提交任何触碰上方 paths 的改动即可。但 push 后备只解决"能不能起 run"，
  # 起来的 run 能不能开跑还要看下方 concurrency 注记——08-07 的 push 后备就是
  # 这样被卡住的 run 挡了整整一个月。
  workflow_dispatch:

# Permissions required by the GitHub Pages deployment actions.
permissions:
  pages: write
  id-token: write
  contents: read

# 同一时刻只允许一个 Pages 部署。cancel-in-progress 取 true 而非官方模板的
# false，是 2026-08-06 事故的第二课：那次 push 的 job 在 Actions/Pages 故障里卡在
# github-pages environment 的 waiting 态（jobs 里有条目但 0 step，从未上 runner），
# false 语义下它算"进行中"、一直占着并发组；之后每个新 run 只能排队、再被下一个
# run 取消（08-06 → 08-18 共十次全是 cancelled），网站停在 08-04 的构建整整 32 天，
# 直到 GitHub 的 30 天 environment 等待上限把它判 failure（2026-09-05T16:32:10Z，
# 同一秒才放行了排队中的 v0.10.3 部署）。job 级 timeout-minutes 管不到没上
# runner 的 job。true 的代价只是：连续两次 push 时，前一次约 35s 的部署可能被
# 中途取消——紧接着的新 run 部署的是更新的内容，站点不会因此落后。
# 若再遇到卡住的 run：`gh run cancel <id>` 手动放行（见 docs/RELEASING.md 清单）。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy website to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      # pnpm 先于 setup-node，理由同 ci.yml（cache: pnpm 需要先找到 pnpm 二进制）。
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11

      # Pin Node via .node-version（与 release.yml 的 verify-version 同一理由）：
      # guard 脚本不应跑在会独立漂移的 runner 默认 Node 上。
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .node-version
          cache: pnpm

      # website/** is paths-ignored by ci.yml — without these checks a JS
      # syntax error or a renamed download asset would deploy straight to prod.
      - name: Website JS syntax check
        run: |
          set -euo pipefail
          for f in website/*.js; do node --check "$f"; done

      - name: Release asset name parity check
        run: node scripts/check-release-assets.mjs

      # website/* 同样在 `vp check`（fmt+lint）的全仓扫描范围内，而 website-only
      # 提交因 paths-ignore 不经过 ci.yml —— 若格式问题从这里溜进 main，翻红的
      # 会是**下一个**触碰其他文件的提交（与 v0.6.0 事故同构、更难归因）。
      # 部署前补一道 vp check，把翻红钉在肇事提交上。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format + lint (vp check)
        run: pnpm exec vp check

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
