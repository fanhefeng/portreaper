<svg xmlns="http://www.w3.org/2000/svg" viewBox="184 184 656 656" role="img" aria-label="Portreaper">
  <!-- 官网用的品牌标：与 src-tauri/icons/icon.svg 同一套几何，去掉圆角深色底板
       （站点背景 #0b0d10 与图标底色 #0a0d0c 本就一致，底板在页面上只会变成一块方形） -->
  <defs>
    <linearGradient id="pr-blade" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#43e6b8"/><stop offset="1" stop-color="#089c72"/>
    </linearGradient>
    <radialGradient id="pr-amber" cx="0.4" cy="0.35" r="0.9">
      <stop offset="0" stop-color="#fcd34d"/><stop offset="1" stop-color="#f59e0b"/>
    </radialGradient>
    <filter id="pr-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- 未收割的端口环 -->
  <circle cx="512" cy="512" r="268" fill="none" stroke="#22322c" stroke-width="56"/>
  <circle cx="512" cy="512" r="160" fill="none" stroke="#1e2a25" stroke-width="10"/>
  <!-- 镰柄 -->
  <g transform="rotate(38 512 512)">
    <rect x="486" y="420" width="52" height="470" rx="26" fill="#2c3a34"/>
    <rect x="496" y="432" width="14" height="440" rx="7" fill="#4d6459" opacity="0.8"/>
  </g>
  <!-- 镰刃即环 -->
  <path d="M 780 512 A 268 268 0 1 1 512 244" fill="none" stroke="url(#pr-blade)"
        stroke-width="56" stroke-linecap="round" filter="url(#pr-glow)"/>
  <path d="M 512 244 A 268 268 0 0 1 742 372 C 700 310 630 262 548 250 Q 528 216 512 244 Z"
        fill="url(#pr-blade)" filter="url(#pr-glow)"/>
  <path d="M 770 486 A 240 240 0 1 1 520 276" fill="none" stroke="#d9fff2" stroke-width="8"
        stroke-linecap="round" opacity="0.35"/>
  <!-- 活端口 -->
  <circle cx="512" cy="512" r="62" fill="url(#pr-amber)" filter="url(#pr-glow)"/>
  <circle cx="494" cy="492" r="18" fill="#ffffff" opacity="0.45"/>
</svg>
